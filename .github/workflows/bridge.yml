name: Bridge

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "bridge/**"
      - "protocol/**"
      - ".github/workflows/bridge.yml"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "bridge/**"
      - "protocol/**"
      - ".github/workflows/bridge.yml"

permissions:
  contents: read

jobs:
  macos-core:
    name: macOS probe core
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: CMakeを設定
        run: cmake --preset macos-debug
      - name: Build
        run: cmake --build --preset macos-debug
      - name: Test
        run: ctest --preset macos-debug

  windows-probe:
    name: Windows Bridge tools
    # CMakePresets.jsonで指定したVisual Studio 2022と揃える。
    # windows-latestはVisual Studio 2026へ移行済みのため固定する。
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CMakeを設定
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: 配布物を作成
        run: >
          cmake --install build/windows-release
          --config Release
          --prefix dist/windows-tools
      - name: 配布物の内容を検証
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist/windows-tools/divive-openvr-bridge.exe",
            "dist/windows-tools/divive-openvr-probe.exe",
            "dist/windows-tools/openvr_api.dll",
            "dist/windows-tools/licenses/openvr/LICENSE"
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missingFiles.Count -gt 0) {
            throw "配布物に必要なfileがありません: $($missingFiles -join ', ')"
          }
          Get-FileHash $requiredFiles -Algorithm SHA256 |
            Select-Object Path, Hash |
            Format-Table -AutoSize
      - name: Windows tools artifactを保存
        uses: actions/upload-artifact@v4
        with:
          name: divive-windows-tools-x64
          path: dist/windows-tools
          if-no-files-found: error
