name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - "scripts/check_docs.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - "scripts/check_docs.py"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links
        run: python3 scripts/check_docs.py
